name: Build release branch

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches:
      - main
    paths:
      - "source/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Build release output
        run: bun run build:release
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          CUSTOM_GITHUB_TOKEN: ${{ secrets.CUSTOM_GITHUB_TOKEN }}

      - name: Prepare provider artifact change notification
        run: bun scripts/notify-artifact-changes.mjs --out .release-work/telegram-notification.html
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Publish release branch
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: release
          publish_dir: ./.release
          force_orphan: true
          commit_message: "Update generated rule artifacts"

      - name: Send provider artifact change notification
        if: hashFiles('.release-work/telegram-notification.html') != ''
        run: bun scripts/notify-artifact-changes.mjs --message-file .release-work/telegram-notification.html
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
